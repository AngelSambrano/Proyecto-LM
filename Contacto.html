<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="canonical" href="https://angelsambrano.github.io/Proyecto-LM/Contacto.html" />
    <meta name="description"
        content="¿Necesitas una reparación? Rellena nuestro formulario y recibe una respuesta técnica en menos de 24 horas.">
        <meta name="keywords" content="presupuesto reparación, soporte técnico, contacto tech repair hub, ubicación taller">
    <meta name="robots" content="index, follow">
    <link rel="stylesheet" href="Styles/index.css">
    <link rel="stylesheet" href="Styles/Contacto.css">
</head>

<body>

    <header>
        <div class="logo">
            <a href="index.html" title="Volver al Inicio"><img src="Imagenes/Tech Reapir Hub (1).png" alt="Logotipo de mi web"></a>
        </div>

        <nav class="menu-principal">

            <input type="checkbox" id="menu-toggle">
            <label for="menu-toggle" class="hamburguesa">&#9776;</label>

            <ul class="menu">
                <li><a href="index.html" title="Ir a la página de inicio">Inicio</a></li>
                <li><a href="Productos.html" title="Ver catálogo de hardware y periféricos">Productos</a></li>
                <li class="dropdown">
                    <a href="Servicios.html" title="Nuestros servicios técnicos de reparación">Servicios<span
                            class="flechas">&#9662;</span></a>
                    <ul class="submenu">
                        <li><a href="Mejoras.html" title="Optimización y ampliación de componentes">Mejoras</a></li>
                        <li><a href="Limpieza.html" title="Limpieza técnica y cambio de pasta térmica">Limpieza</a></li>
                        <li><a href="Reemplazo.html"
                                title="Sustitución de piezas defectuosas con garantía">Reemplazo</a></li>
                    </ul>
                </li>
                <li><a href="Contacto.html" title="Contactar con el servicio técnico">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="form-container">
            <form action="#" method="post">

                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Tu nombre..." required>

                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@correo.com">
                <label for="sucursal">Sucursal en Madrid:</label>
                <select id="sucursal" name="sucursal">
                    <option value="centro">Madrid Centro</option>
                    <option value="norte">Madrid Norte (Alcobendas)</option>
                    <option value="sur">Madrid Sur (Getafe)</option>
                </select>

                <fieldset>
                    <legend>Tipo de Equipo:</legend>
                    <input type="radio" id="Ordenador" name="equipo" value="Ordenador">
                    <label for="Ordenador">Ordenador</label>

                    <input type="radio" id="Consola" name="equipo" value="Consola">
                    <label for="Consola">Consola</label>

                    <input type="radio" id="Impresora" name="equipo" value="Impresora">
                    <label for="Impresora">Impresora</label>
                </fieldset>

                <fieldset class="grupo-checkbox">
                    <legend>Servicios interesados:</legend>
                    <div class="opcion">
                        <input type="checkbox" id="Mejoras" name="servicio" value="mejoras">
                        <label for="Mejoras">Mejorar equipo</label>
                    </div>
                    <div class="opcion">
                        <input type="checkbox" id="Reemplazo" name="servicio" value="reemplazo">
                        <label for="Reemplazo">Reemplazo de piezas</label>
                    </div>
                    <div class="opcion">
                        <input type="checkbox" id="Limpieza" name="servicio" value="limpieza">
                        <label for="Limpieza">Limpieza y Mantenimiento</label>
                    </div>
                </fieldset>

                <label for="comentarios">Observaciones adicionales:</label>
                <textarea id="comentarios" name="comentarios" rows="5"
                    placeholder="Cuéntanos más sobre el estado de tu equipo..."></textarea>

                <div class="botones">
                    <button type="submit">Enviar Solicitud</button>
                    <button type="reset">Limpiar Formulario</button>
                </div>

            </form>
        </section>
    </main>

<footer class="footer-info">

            </a>
            <a href="https://twitter.com" target="_blank" rel="noopener" title="Contacta con nosotros vía X">
                <img src="Imagenes/gorjeo.png" alt="Icono de X" width="24">
            </a>
        </div>
    </span>

    <span>

        </a>
    </span>
</footer>

</body>
